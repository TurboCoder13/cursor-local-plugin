---
name: Native platform checks

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check workflows with Lintro Actionlint
        run: >-
          docker run --rm
          --user "$(id -u):$(id -g)"
          --env HOME=/tmp
          --env LINTRO_AI_ENABLED=0
          --env LINTRO_AI_REVIEW=0
          --mount "type=bind,source=$PWD,target=/work"
          --workdir /work
          ghcr.io/lgtm-hq/py-lintro@sha256:f7c3b4a5f9447ce12879c4b92f3ec7097aa480c925a44a04bc5358dfd70237ed
          chk .github/workflows --tools actionlint --output-format json --no-art

  linux-container:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build the Linux acceptance image
        run: >-
          docker build --file deploy/Dockerfile.linux-check
          --tag cursor-local-linux-check .
      - name: Fetch the checksum-verified pinned CPA runtime
        run: ruby tools/fetch-runtime.rb
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Load the native plugin in the container
        run: >-
          docker run --rm
          --mount "type=bind,src=$PWD/build/runtime,dst=/host,readonly"
          cursor-local-linux-check

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Compile and check against the pinned CPA release
        run: bash scripts/ci/check.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save native build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cursor-local-${{ matrix.os }}
          path: |
            build/*/*/cursor-local.*
            build/*/*/cursor-login*

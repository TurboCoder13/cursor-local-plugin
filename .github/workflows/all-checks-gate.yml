---
name: CI - All Checks Gate

# Keep this caller dedicated: the reusable excludes its own workflow runs
# and gates every other push/PR run, check and commit status on the head SHA.
# Add merge_group only with matching validation producers before using a queue.
'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions: {}

concurrency:
  # PR refreshes share a group; each main push is independent, so even a
  # pending main gate cannot be replaced by another push in the same group.
  group: >-
    all-checks-gate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-all-checks-gate.yml@e6bad3dc6e25455336cabad5acf331a53df4d078  # v0.82.3
    with:
      egress-policy: audit  # TEMP: lgtm-hq/lgtm-ci#1207
    permissions:
      actions: read
      checks: read
      contents: read
      statuses: read

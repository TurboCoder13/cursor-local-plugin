<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cursor Local</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%23222%22/%3E%3Ctext x=%228%22 y=%2224%22 fill=%22white%22 font-size=%2224%22%3EC%3C/text%3E%3C/svg%3E">
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif}body{max-width:1000px;margin:40px auto;padding:0 24px}header{display:flex;justify-content:space-between;align-items:center}h1{font-weight:550}button,input,select{font:inherit;padding:8px;border:1px solid #8888;border-radius:5px}button{cursor:pointer}label{display:inline-flex;gap:8px;align-items:center}section{border:1px solid #8885;padding:22px;margin:22px 0;border-radius:8px}p{line-height:1.5}small{opacity:.75}.models{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin:20px 0}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.metrics{display:flex;gap:22px;flex-wrap:wrap}#notice{min-height:24px}input[type=password]{width:280px;max-width:100%;box-sizing:border-box}.toolbar>label{max-width:100%;flex-wrap:wrap}pre{white-space:pre-wrap}footer{margin:30px 0}
</style>
<header><h1>Cursor Local</h1><select id="language" aria-label="Language"><option value="en">English</option><option value="zh">中文</option></select></header>
<p id="intro"></p>
<div class="toolbar"><label><span id="keyLabel"></span><input id="key" aria-labelledby="keyLabel" type="password" autocomplete="off"></label><button id="load"></button><button id="lock"></button></div>
<p id="notice" role="status"></p><div id="accounts"></div><section id="metrics" hidden></section><footer><small id="privacy"></small></footer>
<script>
'use strict';
const words={en:{intro:'Manage Cursor accounts and the models available through your local proxy.',key:'Management key',load:'Refresh',lock:'Lock',privacy:'The key stays in memory. Only your language preference is saved. Token usage is estimated; host attempts include retries. Subscription usage comes from Cursor and is cached for up to one minute.',empty:'No persisted Cursor accounts. Sign in using the local cursor-login command.',save:'Save models',all:'Enable all',none:'Disable all',confirm:'Disable every model for this account?',enabled:'Enabled models',loading:'Loading…',saved:'Model settings saved.',failure:'Request failed. Check the management key and proxy connection.',quota:'Subscription usage could not be retrieved',plan:'Plan',cursor_models:'Cursor Models',other_models:'Other Models',grok_bot:'Grok Bot · weekly',used:'used',reset:'Usage resets',on_demand:'On-demand spending',disabled:'Disabled',active:'Enabled',usage:'Local executions / completed requests (success, failed)',attempts:'Host attempts (success, failed)',tokens:'Estimated tokens (input, output)',cache:'Checkpoint cache',locked:'Locked'},zh:{intro:'管理 Cursor 账户和通过本地代理可用的模型。',key:'管理密钥',load:'刷新',lock:'锁定',privacy:'密钥仅保存在内存中。仅保存语言偏好。用量是估算值；主机尝试包括重试。订阅用量来自 Cursor，缓存最多一分钟。',empty:'没有已保存的 Cursor 账户。请使用本地 cursor-login 命令登录。',save:'保存模型',all:'全部启用',none:'全部禁用',confirm:'禁用此账户的所有模型？',enabled:'已启用的模型',loading:'正在加载…',saved:'模型设置已保存。',failure:'请求失败。请检查管理密钥和代理连接。',quota:'无法获取订阅用量',plan:'套餐',cursor_models:'Cursor 模型',other_models:'其他模型',grok_bot:'Grok Bot · 每周',used:'已使用',reset:'用量重置',on_demand:'按需支出',disabled:'已禁用',active:'已启用',usage:'本地执行 / 已完成请求（成功、失败）',attempts:'主机尝试（成功、失败）',tokens:'估算令牌（输入、输出）',cache:'检查点缓存',locked:'已锁定'}};
const byId=id=>document.getElementById(id);
let storageAvailable=true;let language='en';try{language=localStorage.getItem('cursor-local-language')==='zh'?'zh':'en';}catch{storageAvailable=false;}
let data=null;let revision=0;const pending=new Set();
function t(key){return words[language][key];}
function element(tag,text){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;return node;}
function notice(text){byId('notice').textContent=text;}
async function api(path,method='GET',body){const key=byId('key').value;if(!key)throw new Error('key');const controller=new AbortController();pending.add(controller);try{const response=await fetch('/v0/management/plugins/cursor-local/'+path,{method,headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store',credentials:'omit',redirect:'error',signal:controller.signal});if(!response.ok)throw new Error('request');return await response.json();}finally{pending.delete(controller);}}

function render(){document.documentElement.lang=language;byId('language').value=language;byId('intro').textContent=t('intro');byId('keyLabel').textContent=t('key');byId('load').textContent=t('load');byId('lock').textContent=t('lock');byId('privacy').textContent=t('privacy');byId('accounts').replaceChildren();byId('metrics').hidden=!data;if(!data)return;
if(!data.accounts.length)byId('accounts').append(element('p',t('empty')));
for(const account of data.accounts){const section=element('section');section.append(element('h2',account.label||account.name),element('p',account.status));const q=account.subscription_quota;if(q&&q.subscription)section.append(element('p',t('plan')+': '+q.subscription.plan));if(q&&q.groups&&q.groups.length){for(const group of q.groups)for(const bucket of group.buckets){section.append(element('p',t(bucket.window)+': '+Math.max(0,Math.ceil((1-bucket.remainingFraction)*100-1e-9))+'% '+t('used')));if(bucket.resetTime)section.append(element('small',t('reset')+': '+new Date(bucket.resetTime).toLocaleString(language)));}}else section.append(element('small',t('quota')));if(q&&q.summary){const enabled=q.summary.find(metric=>metric.key==='on_demand_enabled');if(enabled)section.append(element('p',t('on_demand')+': '+t(enabled.value===1?'active':'disabled')));}const u=account.local_usage,h=account.host_runtime;const metrics=element('div');metrics.className='metrics';metrics.append(element('p',t('usage')+': '+u.executions+' / '+u.logical_success+', '+u.logical_failed),element('p',t('attempts')+': '+h.success_attempts+', '+h.failed_attempts),element('p',t('tokens')+': '+u.estimated_prompt_tokens+', '+u.estimated_completion_tokens));section.append(metrics,element('h3',t('enabled')));const models=element('div');models.className='models';const inputs=[];
for(const model of account.models){const label=element('label');const checkbox=element('input');checkbox.type='checkbox';checkbox.checked=!model.disabled;checkbox.dataset.model=model.ID;inputs.push(checkbox);label.append(checkbox,element('span',model.ID+(model.NativeContextLength?' · '+model.NativeContextLength.toLocaleString():'')));models.append(label);}section.append(models);const controls=element('div');controls.className='toolbar';for(const [key,enabled]of [['all',true],['none',false]]){const button=element('button',t(key));button.onclick=()=>{for(const input of inputs)input.checked=enabled;};controls.append(button);}const save=element('button',t('save'));save.onclick=async()=>{const disabled=inputs.filter(input=>!input.checked).map(input=>input.dataset.model);const all=inputs.length>0&&disabled.length===inputs.length;if(all&&!confirm(t('confirm')))return;save.disabled=true;try{await api('disabled-models','PUT',{auth_index:account.auth_index,disabled_models:disabled,confirm_disable_all:all});notice(t('saved'));}catch{notice(t('failure'));}finally{save.disabled=false;}};controls.append(save);section.append(controls);byId('accounts').append(section);}
byId('metrics').replaceChildren(element('h2',t('cache')),element('pre',JSON.stringify({entries:data.cache_entries,session_turns:data.session_turns,...data.checkpoint_metrics},null,2)));}
byId('language').onchange=()=>{language=byId('language').value;if(storageAvailable){try{localStorage.setItem('cursor-local-language',language);}catch{storageAvailable=false;}}render();};
byId('load').onclick=async()=>{const stamp=revision;byId('load').disabled=true;notice(t('loading'));try{const status=await api('status');if(stamp===revision){data=status;render();notice('');}}catch{if(stamp===revision)notice(t('failure'));}finally{byId('load').disabled=false;}};
byId('lock').onclick=()=>{revision++;for(const controller of pending)controller.abort();byId('key').value='';data=null;render();notice(t('locked'));};
render();
</script>
</html>
